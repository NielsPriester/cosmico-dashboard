<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1d5b14">
  <meta name="robots" content="noindex,nofollow">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Hartenjagen">
  <title>Hartenjagen Scorebord</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>♥️</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,400;0,600;0,700;0,800;1,400&family=Kaushan+Script&display=swap">
  <style>
    /* Stijl: tropisch reisbureau — diepgroen, lichtgrijs, oranje knoppen */
    :root {
      --green: #1d5b14;
      --green-2: #26701b;
      --green-soft: #e7f1e4;
      --orange: #ff9b0f;
      --orange-2: #ffae3d;
      --bg: #f4f4f4;
      --card: #ffffff;
      --ink: #3a3a3a;
      --head: #444444;
      --muted: #8a8a8a;
      --line: #e4e4e4;
      --red: #c62828;
      --red-soft: #fdecec;
      --gold: #e08a00;
      --good: #1d5b14;
      --good-soft: #e7f1e4;
      --shadow: 0 1px 3px rgba(0,0,0,.06);
      --radius: 4px;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #111511;
        --card: #1b201b;
        --ink: #e9ece8;
        --head: #f1f3f0;
        --muted: #9aa39a;
        --line: #2e352e;
        --green-soft: #1c2f19;
        --red: #ef5350;
        --red-soft: #3a1717;
        --good: #7cc56f;
        --good-soft: #1c2f19;
      }
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; }
    body {
      font-family: "Open Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg); color: var(--ink); min-height: 100vh;
      padding-bottom: calc(24px + env(safe-area-inset-bottom));
    }
    .wrap { max-width: 640px; margin: 0 auto; padding: 0 16px; }

    /* Kopbalk */
    header.top { background: var(--green); color: #fff; padding-top: env(safe-area-inset-top); margin-bottom: 18px; }
    header.top .wrap { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-top: 16px; padding-bottom: 16px; }
    header.top .brand { display: flex; flex-direction: column; line-height: 1; }
    header.top .tagline { font-family: "Kaushan Script", cursive; font-size: 1.05rem; color: rgba(255,255,255,.85); margin-bottom: 4px; }
    header.top h1 { margin: 0; font-size: clamp(1.45rem, 7vw, 1.9rem); font-weight: 800; letter-spacing: .01em; text-transform: uppercase; display: flex; gap: .3em; align-items: center; }
    header.top h1 .suit { color: var(--orange); }
    .iconbtn {
      background: rgba(255,255,255,.16); color: #fff; border: 0; border-radius: 999px;
      padding: 11px 16px; font: inherit; font-size: .9rem; font-weight: 600; cursor: pointer; white-space: nowrap; flex-shrink: 0;
    }
    .iconbtn:active { transform: scale(.97); }

    .panel {
      background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow);
      padding: 20px 18px; margin-bottom: 16px;
    }
    .panel h2 {
      margin: 0 0 16px; font-size: 1.15rem; font-weight: 700; color: var(--head); text-transform: uppercase; letter-spacing: .02em;
    }
    .panel h2::after { content: ""; display: block; width: 44px; height: 4px; background: var(--green); margin-top: 8px; }
    .muted { color: var(--muted); font-size: .9rem; }
    label.field { display: block; margin-bottom: 12px; }
    label.field span { display: block; font-size: .85rem; font-weight: 600; color: var(--head); margin-bottom: 5px; }
    input[type=text], input[type=number], select {
      width: 100%; font: inherit; font-size: 1rem; padding: 11px 12px;
      border-radius: var(--radius); border: 1px solid var(--line); background: var(--card); color: var(--ink);
    }
    select option { color: #3a3a3a; background: #fff; }
    input:focus, select:focus { outline: 2px solid var(--green); outline-offset: 0; border-color: transparent; }
    .row { display: flex; gap: 10px; align-items: center; }
    .row > * { flex: 1; }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      font: inherit; font-weight: 600; font-size: 1.05rem; padding: 13px 18px; border-radius: 6px;
      border: 0; cursor: pointer; background: linear-gradient(180deg, var(--orange-2), var(--orange)); color: #fff; width: 100%;
      box-shadow: 0 2px 0 rgba(0,0,0,.08);
    }
    .btn:disabled { opacity: .45; cursor: not-allowed; }
    .btn.ghost { background: transparent; color: var(--green); border: 1.5px solid var(--green); box-shadow: none; }
    @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn.ghost { color: var(--good); border-color: var(--good); } }
    .btn.small { padding: 8px 12px; font-size: .9rem; width: auto; }
    .btn:active:not(:disabled) { transform: scale(.98); }

    /* Setup */
    .player-input { display: flex; gap: 8px; margin-bottom: 8px; }
    .player-input input { flex: 1; }
    .player-input button { flex: 0 0 44px; }
    .settings-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
    .settings-grid label.field span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* Scorebord */
    .info-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
    .chip {
      background: var(--card); color: var(--green); border: 1px solid var(--line); padding: 6px 12px; border-radius: 999px;
      font-size: .85rem; font-weight: 600;
    }
    @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .chip { color: var(--good); } }
    .standings { display: grid; gap: 10px; }
    .stand {
      display: grid; grid-template-columns: 40px 1fr auto; align-items: center; gap: 12px;
      padding: 10px 14px 10px 10px; border-radius: var(--radius); border: 1px solid var(--line);
    }
    .stand .pos {
      width: 40px; height: 40px; border-radius: 50%; background: var(--green); color: #fff;
      display: grid; place-items: center; font-weight: 700; position: relative;
    }
    .stand .pos::before { content: ""; position: absolute; inset: 4px; border-radius: 50%; border: 1.5px dotted rgba(255,255,255,.7); }
    .stand .name { font-weight: 700; color: var(--head); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .stand .bar { height: 5px; border-radius: 3px; background: var(--line); margin-top: 7px; overflow: hidden; }
    .stand .bar i { display: block; height: 100%; background: var(--orange); border-radius: 3px; }
    .stand .total { font-size: 1.6rem; font-weight: 800; color: var(--head); font-variant-numeric: tabular-nums; }
    .stand.lead { border-color: var(--green); background: var(--green-soft); }
    .stand.danger .total { color: var(--red); }
    .stand.danger .bar i { background: var(--red); }

    /* Ronde invoeren */
    .entry-player {
      display: grid; grid-template-columns: 1fr auto auto auto; gap: 8px; align-items: center;
      padding: 10px 0; border-bottom: 1px solid var(--line);
    }
    .entry-player:last-of-type { border-bottom: 0; }
    .entry-player.nojack { grid-template-columns: 1fr auto auto; }
    .entry-player .nm { font-weight: 700; color: var(--head); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .entry-player .pts { font-size: .8rem; color: var(--muted); white-space: nowrap; }
    .stepper { display: flex; align-items: center; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
    .stepper button {
      width: 36px; height: 42px; border: 0; background: transparent; color: var(--green);
      font-size: 1.3rem; font-weight: 700; cursor: pointer;
    }
    @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .stepper button { color: var(--good); } }
    .stepper button:active { background: var(--line); }
    .stepper .hv { display: flex; align-items: center; gap: 1px; padding-right: 2px; }
    .stepper input.hearts-input {
      width: 34px; height: 42px; padding: 0; border: 0; border-radius: 0; background: transparent; color: var(--ink);
      text-align: center; font: inherit; font-weight: 800; font-size: 1.15rem; font-variant-numeric: tabular-nums; -moz-appearance: textfield;
    }
    .stepper input.hearts-input::-webkit-outer-spin-button, .stepper input.hearts-input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    .stepper input.hearts-input:focus { outline: 0; background: var(--green-soft); }
    .stepper .hv i { font-style: normal; color: var(--red); font-size: .85rem; }
    .queen {
      width: 44px; height: 44px; border-radius: 50%; border: 1.5px dashed var(--line);
      background: transparent; color: var(--muted); font: inherit; font-weight: 700; font-size: .9rem; cursor: pointer;
    }
    .queen.on { background: var(--green); color: #fff; border: 1.5px solid var(--green); box-shadow: inset 0 0 0 3px var(--green), inset 0 0 0 4.5px rgba(255,255,255,.6); }
    .manual-input { width: 90px !important; text-align: center; font-weight: 700; }
    .entry-status {
      margin: 14px 0; padding: 10px 12px; border-radius: var(--radius); font-size: .9rem; font-weight: 600;
      background: var(--red-soft); color: var(--red);
    }
    .entry-status.ok { background: var(--good-soft); color: var(--good); }
    .toggle { display: flex; align-items: center; gap: 8px; font-size: .9rem; color: var(--muted); cursor: pointer; user-select: none; }
    .toggle input { width: 18px; height: 18px; accent-color: var(--green); }
    .entry-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; margin-bottom: 4px; flex-wrap: wrap; }
    .entry-head h2 { margin-bottom: 12px; }

    /* Rondes */
    .table-wrap { overflow-x: auto; margin: 0 -18px; padding: 0 18px; }
    table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
    th, td { padding: 8px 6px; text-align: center; border-bottom: 1px solid var(--line); white-space: nowrap; }
    th { font-size: .8rem; color: var(--muted); font-weight: 700; max-width: 80px; overflow: hidden; text-overflow: ellipsis; }
    td:first-child, th:first-child { text-align: left; color: var(--muted); }
    tbody tr[data-k] { cursor: pointer; }
    tr.flip-row td { text-align: center !important; color: var(--gold) !important; font-weight: 800; font-size: .85rem; background: #fff4e0; border-bottom: 0; }
    .flip-banner { margin: 0 0 12px; padding: 10px 12px; border-radius: var(--radius); background: #fff4e0; color: #8a5200; font-weight: 600; font-size: .9rem; }
    @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) tr.flip-row td, :root:not([data-theme="light"]) .flip-banner { background: #3a2c12; color: #ffc46b; } }
    tbody tr:hover { background: var(--bg); }
    tbody tr.editing { background: #fff4e0; }
    @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) tbody tr.editing { background: #3a2c12; } }
    td .sub { display: block; font-size: .7rem; color: var(--muted); }
    td .sub.reset { color: var(--gold); font-weight: 800; }
    .moon-box { margin: 14px 0 0; padding: 12px; border-radius: var(--radius); background: #fff4e0; }
    .moon-box p { margin: 0 0 10px; font-weight: 700; color: #8a5200; font-size: .95rem; }
    .moon-box .row .btn { font-size: .95rem; padding: 11px 10px; }
    .moon-box .btn.ghost { background: var(--card); }
    .moon-box .btn.picked { background: var(--green); color: #fff; border-color: var(--green); }
    @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .moon-box { background: #3a2c12; } :root:not([data-theme="light"]) .moon-box p { color: #ffc46b; } }
    td.moon { color: var(--gold); font-weight: 800; }
    tfoot td { font-weight: 800; color: var(--head); border-bottom: 0; border-top: 3px solid var(--green); }

    /* Winnaar */
    .winner { text-align: center; padding: 26px 18px; }
    .winner .big { font-size: 2.6rem; }
    .winner .tag { font-family: "Kaushan Script", cursive; font-size: 1.3rem; color: var(--head); }
    .winner h2 { font-size: 1.6rem; margin: 2px 0 10px; }
    .winner h2::after { margin: 10px auto 0; }

    .undo-fab {
      position: fixed; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom)); z-index: 9;
      display: inline-flex; align-items: center; gap: 6px; padding: 13px 18px; border-radius: 999px; border: 0;
      background: var(--green); color: #fff; font: inherit; font-weight: 700; font-size: 1rem; cursor: pointer;
      box-shadow: 0 6px 18px rgba(0,0,0,.25);
    }
    .undo-fab:active { transform: scale(.96); }
    body.has-undo { padding-bottom: calc(84px + env(safe-area-inset-bottom)); }
    .toast {
      position: fixed; left: 50%; bottom: calc(84px + env(safe-area-inset-bottom)); transform: translateX(-50%) translateY(calc(100% + 140px));
      background: var(--green); color: #fff; padding: 12px 18px; border-radius: 6px; font-weight: 600;
      box-shadow: 0 6px 20px rgba(0,0,0,.2); transition: transform .25s ease, visibility .25s; visibility: hidden; z-index: 10; max-width: calc(100% - 32px); text-align: center;
    }
    .toast.show { transform: translateX(-50%) translateY(0); visibility: visible; }
    .hidden { display: none !important; }
    details summary { cursor: pointer; font-weight: 700; color: var(--head); }
    details ul { margin: 12px 0 0; padding-left: 20px; color: var(--muted); font-size: .9rem; line-height: 1.6; }
  </style>
</head>
<body>
  <header class="top">
    <div class="wrap">
      <div class="brand">
        <span class="tagline">Scorebord voor onderweg</span>
        <h1><span class="suit">♥</span> Hartenjagen</h1>
      </div>
      <button class="iconbtn hidden" id="btnNew" type="button">Nieuw spel</button>
    </div>
  </header>
  <div class="wrap">

    <!-- SETUP -->
    <section id="setup">
      <div class="panel">
        <h2>Spelers</h2>
        <div id="playerInputs"></div>
        <button class="btn ghost small" id="btnAddPlayer" type="button">+ Speler toevoegen</button>
        <p class="muted" style="margin:10px 0 0">3 tot 6 spelers. Meestal speel je met 4.</p>
      </div>
      <div class="panel">
        <h2>Spelregels</h2>
          <label class="field"><span>Spelen tot (punten)</span>
            <input type="number" id="setTarget" min="10" step="5" value="100" inputmode="numeric">
          </label>
        <label class="field"><span>Komt iemand op of boven die score</span>
          <select id="setAtTarget">
            <option value="flip">Omdraaien: iedereen telt af naar 0</option>
            <option value="end">Spel is afgelopen</option>
          </select>
        </label>

        <div class="settings-grid">
          <label class="field"><span>Aantal ♥</span>
            <input type="number" id="setHearts" min="1" max="13" step="1" value="8" inputmode="numeric">
          </label>
          <label class="field"><span>♠ Vrouw telt</span>
            <input type="number" id="setQueen" min="0" step="1" value="5" inputmode="numeric">
          </label>
          <label class="field"><span>♣ Boer telt</span>
            <input type="number" id="setJack" min="0" step="1" value="2" inputmode="numeric">
          </label>
        </div>
        <label class="field"><span>Alle punten gehaald (“de maan schieten”)</span>
          <select id="setMoon">
            <option value="choose">Kiezen: zelf punten eraf of de anderen erbij</option>
            <option value="none">Geen speciale regel</option>
          </select>
        </label>
      </div>
      <button class="btn" id="btnStart" type="button">Start spel ♥</button>
    </section>

    <!-- GAME -->
    <section id="game" class="hidden">
      <div class="info-bar" id="infoBar"></div>

      <div class="panel winner hidden" id="winnerPanel"></div>

      <div class="panel">
        <h2>Stand</h2>
        <div class="flip-banner hidden" id="flipBanner"></div>
        <div class="standings" id="standings"></div>
      </div>

      <div class="panel" id="entryPanel">
        <div class="entry-head">
          <h2 id="entryTitle">Ronde 1</h2>
          <label class="toggle"><input type="checkbox" id="manualToggle"> Vrij invoeren</label>
        </div>
        <p class="muted" id="entryHint" style="margin:0 0 4px">Tel per speler de harten en tik op <b>♠V</b> bij wie de schoppenvrouw heeft.</p>
        <div id="entryRows"></div>
        <div class="moon-box hidden" id="moonBox"></div>
        <div class="entry-status" id="entryStatus"></div>
        <div class="row">
          <button class="btn ghost hidden" id="btnCancelEdit" type="button">Annuleren</button>
          <button class="btn" id="btnSave" type="button" disabled>Ronde opslaan</button>
        </div>
        <button class="btn ghost hidden" id="btnFinish" type="button" style="margin-top:10px">🏁 Spel afronden</button>
      </div>

      <div class="panel" id="historyPanel">
        <div class="entry-head">
          <h2>Rondes</h2>
          <button class="btn ghost small" id="btnUndo" type="button">↶ Laatste wissen</button>
        </div>
        <p class="muted" style="margin:0 0 8px">Tik op een ronde om die aan te passen.</p>
        <div class="table-wrap"><table id="historyTable"></table></div>
      </div>

      <div class="panel">
        <details>
          <summary>Puntentelling</summary>
          <ul id="rulesList"></ul>
        </details>
      </div>
    </section>
  </div>

  <button class="undo-fab hidden" id="btnStepBack" type="button" aria-label="Stap terug">↶ Stap terug</button>
  <div class="toast" id="toast"></div>

  <script>
  (function () {
    'use strict';
    var KEY = 'hartenjagen-v1';
    // Aantal harten in het spel (kort spel met 32 kaarten = 8). Oude spellen zonder instelling: 8.
    function heartsCount() { return (state && state.settings.hearts) || DEFAULT_RULES.hearts; }
    var $ = function (id) { return document.getElementById(id); };

    var state = load() || null;
    var draft = null;        // { hearts:[], queen:-1, jack:-1, manual:[], isManual:false }
    var editIndex = -1;      // index of round being edited, -1 = new round
    var setupNames = ['', '', '', ''];

    function load() {
      try { var s = JSON.parse(localStorage.getItem(KEY)); return s && s.players ? s : null; } catch (e) { return null; }
    }
    function save() {
      try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
    }
    /* ---------- Stap terug ---------- */
    // Voor elke wijziging (invoer of opgeslagen ronde) bewaren we een kopie van alles,
    // zodat "Stap terug" telkens precies één handeling terugdraait. Blijft bewaard na herladen.
    var UNDO_KEY = 'hartenjagen-undo-v1', UNDO_MAX = 60;
    var undoStack = (function () { try { var u = JSON.parse(localStorage.getItem(UNDO_KEY)); return Array.isArray(u) ? u : []; } catch (e) { return []; } })();
    function saveUndo() { try { localStorage.setItem(UNDO_KEY, JSON.stringify(undoStack)); } catch (e) {} }
    function checkpoint(label) {
      undoStack.push(JSON.stringify({ state: state, draft: draft, editIndex: editIndex, label: label }));
      if (undoStack.length > UNDO_MAX) undoStack.shift();
      saveUndo(); updateUndoBtn();
    }
    function updateUndoBtn() {
      var has = undoStack.length > 0;
      $('btnStepBack').classList.toggle('hidden', !has);
      document.body.classList.toggle('has-undo', has);
    }
    function stepBack() {
      if (!undoStack.length) return;
      var snap = JSON.parse(undoStack.pop()); saveUndo();
      var wasInGame = !!state;
      state = snap.state; draft = snap.draft; editIndex = snap.editIndex;
      if (state) save(); else { try { localStorage.removeItem(KEY); } catch (e) {} }
      if (!!state !== wasInGame) show();
      else if (state) render();
      updateUndoBtn();
      toast('↶ Teruggezet: ' + snap.label);
    }

    function esc(s) {
      return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; });
    }
    function toast(msg) {
      var t = $('toast'); t.textContent = msg; t.classList.add('show');
      clearTimeout(toast._t); toast._t = setTimeout(function () { t.classList.remove('show'); }, 2200);
    }

    /* ---------- Setup ---------- */
    // Standaard huisregels: tot 100 (dan terug naar 0), schoppenvrouw 5, klaverboer 2.
    var DEFAULT_RULES = { target: 100, atTarget: 'flip', hearts: 8, queen: 5, jack: 2, moon: 'choose' };
    function setDefaultRules() {
      $('setTarget').value = DEFAULT_RULES.target;
      $('setAtTarget').value = DEFAULT_RULES.atTarget;
      $('setHearts').value = DEFAULT_RULES.hearts;
      $('setQueen').value = DEFAULT_RULES.queen;
      $('setJack').value = DEFAULT_RULES.jack;
      $('setMoon').value = DEFAULT_RULES.moon;
    }

    function renderSetup() {
      var box = $('playerInputs'); box.innerHTML = '';
      setupNames.forEach(function (n, i) {
        var d = document.createElement('div'); d.className = 'player-input';
        d.innerHTML = '<input type="text" maxlength="16" autocomplete="off" placeholder="Speler ' + (i + 1) + '" value="' + esc(n) + '">' +
          (setupNames.length > 3 ? '<button class="btn ghost small" type="button" aria-label="Verwijder">✕</button>' : '');
        d.querySelector('input').addEventListener('input', function (e) { setupNames[i] = e.target.value; });
        var rm = d.querySelector('button');
        if (rm) rm.addEventListener('click', function () { setupNames.splice(i, 1); renderSetup(); });
        box.appendChild(d);
      });
      $('btnAddPlayer').classList.toggle('hidden', setupNames.length >= 6);
    }
    $('btnAddPlayer').addEventListener('click', function () {
      if (setupNames.length < 6) { setupNames.push(''); renderSetup(); var ins = $('playerInputs').querySelectorAll('input'); ins[ins.length - 1].focus(); }
    });
    $('btnStart').addEventListener('click', function () {
      var players = setupNames.map(function (n, i) { return n.trim() || ('Speler ' + (i + 1)); });
      var target = Math.max(10, parseInt($('setTarget').value, 10) || 100);
      var hearts = Math.min(13, Math.max(1, parseInt($('setHearts').value, 10) || DEFAULT_RULES.hearts));
      var queen = Math.max(0, parseInt($('setQueen').value, 10));
      if (isNaN(queen)) queen = 5;
      var jack = Math.max(0, parseInt($('setJack').value, 10));
      if (isNaN(jack)) jack = 2;
      checkpoint('spel gestart');
      state = { players: players, rounds: [], settings: { target: target, hearts: hearts, queen: queen, jack: jack, atTarget: $('setAtTarget').value, moon: $('setMoon').value }, started: Date.now() };
      save(); editIndex = -1; resetDraft(); show();
    });
    $('btnNew').addEventListener('click', function () {
      if (state && state.rounds.length && !confirm('Huidig spel stoppen en een nieuw spel beginnen?')) return;
      if (state) {
        setupNames = state.players.slice();
        checkpoint('nieuw spel');
      }
      state = null;
      setDefaultRules();
      try { localStorage.removeItem(KEY); } catch (e) {}
      show();
    });

    /* ---------- Scoring ---------- */
    function jackValue() { return state.settings.jack || 0; }
    function totalPoints() { return heartsCount() + state.settings.queen + jackValue(); }

    function moonRule() { return state.settings.moon !== 'none'; }
    // Oude rondes zonder keuze: volg de vroegere vaste instelling.
    function legacyMoonChoice() { return state.settings.moon === 'self' ? 'self' : 'others'; }

    // Geeft per speler de verandering van de stand (scores) voor deze ronde.
    // Gewone ronde: strafpunten erbij (optellen) of eraf (na omdraaien).
    // Maan (alle punten bij één speler): keuze 'self' = zelf alles eraf, 'others' = de anderen alles erbij;
    // dat werkt direct op de stand, dus in beide fasen hetzelfde.
    function scoreRound(hearts, queen, jack, phase, choice) {
      var n = state.players.length, s = state.settings, jv = jackValue();
      var raw = hearts.map(function (h, i) { return h + (i === queen ? s.queen : 0) + (i === jack ? jv : 0); });
      var moon = -1;
      for (var i = 0; i < n; i++) if (hearts[i] === heartsCount() && queen === i && (jv === 0 || jack === i)) moon = i;
      var sign = phase === 'down' ? -1 : 1;
      var pts = raw.map(function (v) { return v * sign; });
      var needsChoice = false;
      if (moon >= 0 && moonRule()) {
        var t = totalPoints();
        if (choice === 'self') pts = raw.map(function (_, i) { return i === moon ? -t : 0; });
        else if (choice === 'others') pts = raw.map(function (_, i) { return i === moon ? 0 : t; });
        else needsChoice = true;
      }
      return { scores: pts, raw: raw, moon: moon, needsChoice: needsChoice };
    }

    // Standaard: omdraaien. Oude spellen met de vroegere terug-naar-0-regel ('reset') tellen ook als omdraaien.
    function flipMode() { return state.settings.atTarget !== 'end'; }

    // Loopt alle rondes door. Omdraaien: iedereen telt op tot iemand de grens haalt,
    // daarna gaan voor iedereen de punten eraf. Wie dan op 0 of lager komt, wint.
    function runInfo(upto) {
      var t = state.players.map(function () { return 0; });
      var r = state.rounds; var end = upto == null ? r.length : upto;
      var runs = [], eff = [], phases = [], phase = 'up', flipAt = -1, done = false;
      for (var k = 0; k < end; k++) {
        var rd = r[k];
        var sign = phase === 'down' ? -1 : 1;
        var e = (!rd.manual && rd.hearts)
          ? scoreRound(rd.hearts, rd.queen, rd.jack, phase, rd.moonChoice || legacyMoonChoice()).scores
          : rd.scores.map(function (v) { return v * sign; });
        e.forEach(function (v, i) { t[i] += v; });
        phases.push(phase); eff.push(e); runs.push(t.slice());
        if (flipMode()) {
          if (phase === 'up' && t.some(function (v) { return v >= state.settings.target; })) { phase = 'down'; flipAt = k; }
          else if (phase === 'down' && t.some(function (v) { return v <= 0; })) done = true;
        }
      }
      return { totals: t, runs: runs, eff: eff, phases: phases, phase: phase, flipAt: flipAt, done: done };
    }
    function totals(upto) { return runInfo(upto).totals; }
    function currentPhase() { return runInfo(editIndex >= 0 ? editIndex : null).phase; }

    function isFinished() {
      if (!state.rounds.length) return false;
      if (flipMode()) return !!state.finished || runInfo().done;
      return totals().some(function (v) { return v >= state.settings.target; });
    }

    function passInfo(roundIdx) {
      var n = state.players.length;
      var dirs = n === 4 ? ['naar links', 'naar rechts', 'naar overkant', 'niet passen'] : ['naar links', 'naar rechts', 'niet passen'];
      return dirs[roundIdx % dirs.length];
    }

    /* ---------- Draft (round entry) ---------- */
    function resetDraft(fromRound) {
      var n = state.players.length;
      if (fromRound) {
        draft = {
          hearts: fromRound.hearts ? fromRound.hearts.slice() : state.players.map(function () { return 0; }),
          queen: fromRound.queen != null ? fromRound.queen : -1,
          jack: fromRound.jack != null ? fromRound.jack : -1,
          manual: fromRound.scores.slice(),
          moonChoice: fromRound.moonChoice || (fromRound.moon >= 0 ? legacyMoonChoice() : null),
          isManual: !!fromRound.manual
        };
      } else {
        draft = { hearts: new Array(n).fill(0), queen: -1, jack: -1, moonChoice: null, manual: new Array(n).fill(''), isManual: draft ? draft.isManual : false };
      }
    }

    function draftPreview() { return scoreRound(draft.hearts, draft.queen, draft.jack, currentPhase(), draft.moonChoice); }

    function draftValid() {
      if (draft.isManual) {
        return draft.manual.every(function (v) { return v !== '' && !isNaN(parseInt(v, 10)); });
      }
      var sum = draft.hearts.reduce(function (a, b) { return a + b; }, 0);
      return sum === heartsCount() && draft.queen >= 0 && (jackValue() === 0 || draft.jack >= 0) && !draftPreview().needsChoice;
    }

    function renderEntry() {
      var rows = $('entryRows'); rows.innerHTML = '';
      var roundNo = editIndex >= 0 ? editIndex + 1 : state.rounds.length + 1;
      $('entryTitle').textContent = (editIndex >= 0 ? 'Ronde ' + roundNo + ' aanpassen' : 'Ronde ' + roundNo);
      $('manualToggle').checked = draft.isManual;
      $('entryHint').innerHTML = draft.isManual
        ? 'Vul per speler de punten van deze ronde in (eigen huisregels).' + (currentPhase() === 'down' ? ' <b>Omgedraaid:</b> deze punten gaan eraf.' : '')
        : 'Vul per speler het aantal harten in (of gebruik − en +) en tik op <b>♠V</b> bij wie de schoppenvrouw heeft' + (jackValue() ? ' en op <b>♣B</b> bij wie de klaverboer heeft.' : '.');
      $('btnCancelEdit').classList.toggle('hidden', editIndex < 0);
      $('btnSave').textContent = editIndex >= 0 ? 'Wijziging opslaan' : 'Ronde opslaan';

      var preview = draft.isManual ? null : draftPreview();
      state.players.forEach(function (name, i) {
        var d = document.createElement('div'); d.className = 'entry-player';
        if (draft.isManual) {
          d.style.gridTemplateColumns = '1fr auto';
          d.innerHTML = '<div class="nm">' + esc(name) + '</div>' +
            '<input type="number" inputmode="numeric" class="manual-input" placeholder="0" value="' + esc(draft.manual[i]) + '">';
          var inp = d.querySelector('input');
          var mPending = true;
          inp.addEventListener('input', function (e) { if (mPending) { checkpoint('punten ' + name); mPending = false; } draft.manual[i] = e.target.value; updateStatus(); });
          inp.addEventListener('focus', function (e) { mPending = true; e.target.select(); });
        } else {
          var p = preview.scores[i];
          d.innerHTML = '<div><div class="nm">' + esc(name) + '</div><div class="pts">' + fmtPts(p) + '</div></div>' +
            '<div class="stepper"><button type="button" aria-label="Minder">−</button><span class="hv"><input type="number" inputmode="numeric" pattern="[0-9]*" min="0" max="' + heartsCount() + '" class="hearts-input" aria-label="Aantal harten ' + esc(name) + '" value="' + draft.hearts[i] + '"><i>♥</i></span><button type="button" aria-label="Meer">+</button></div>' +
            '<button type="button" class="queen' + (draft.queen === i ? ' on' : '') + '" aria-label="Schoppenvrouw" aria-pressed="' + (draft.queen === i) + '">♠V</button>' +
            (jackValue() ? '<button type="button" class="queen jack' + (draft.jack === i ? ' on' : '') + '" aria-label="Klaverboer" aria-pressed="' + (draft.jack === i) + '">♣B</button>' : '');
          if (!jackValue()) d.classList.add('nojack');
          // Zelf invullen: bijwerken zonder de rij opnieuw te tekenen, zodat het toetsenbord open blijft.
          var hi = d.querySelector('.hearts-input');
          var selectAll = function (e) { var t = e.target; setTimeout(function () { try { t.select(); } catch (x) {} }, 0); };
          var hPending = true;
          hi.addEventListener('focus', function (e) { hPending = true; selectAll(e); });
          hi.addEventListener('click', selectAll);
          hi.addEventListener('input', function (e) {
            if (hPending) { checkpoint('harten ' + name); hPending = false; }
            var others = draft.hearts.reduce(function (a, c, k) { return a + (k === i ? 0 : c); }, 0);
            var max = heartsCount() - others;
            var v = parseInt(e.target.value, 10);
            if (isNaN(v) || v < 0) v = 0;
            if (v > max) { v = max; e.target.value = v; toast('Er zijn nog maar ' + max + ' ♥ over voor ' + name); }
            else if (e.target.value !== '' && e.target.value !== String(v)) e.target.value = v;
            draft.hearts[i] = v;
            refreshPoints();
          });
          hi.addEventListener('blur', function (e) { e.target.value = draft.hearts[i]; });
          var b = d.querySelectorAll('.stepper button');
          b[0].addEventListener('click', function () { if (draft.hearts[i] > 0) { checkpoint('− harten ' + name); draft.hearts[i]--; renderEntry(); } });
          b[1].addEventListener('click', function () {
            var sum = draft.hearts.reduce(function (a, c) { return a + c; }, 0);
            if (sum < heartsCount()) { checkpoint('+ harten ' + name); draft.hearts[i]++; renderEntry(); }
          });
          d.querySelector('.queen:not(.jack)').addEventListener('click', function () { checkpoint('♠ vrouw ' + name); draft.queen = draft.queen === i ? -1 : i; renderEntry(); });
          var jb = d.querySelector('.jack');
          if (jb) jb.addEventListener('click', function () { checkpoint('♣ boer ' + name); draft.jack = draft.jack === i ? -1 : i; renderEntry(); });
        }
        rows.appendChild(d);
      });
      updateStatus(preview);
    }

    function fmtPts(v) {
      return (v > 0 ? '+' : v < 0 ? '−' : '') + Math.abs(v) + ' punten';
    }

    function refreshPoints() {
      var preview = draftPreview();
      var pts = $('entryRows').querySelectorAll('.pts');
      preview.scores.forEach(function (p, i) { if (pts[i]) pts[i].textContent = fmtPts(p); });
      updateStatus(preview);
    }

    function renderMoonBox(preview) {
      var box = $('moonBox');
      var show = !draft.isManual && preview && preview.moon >= 0 && moonRule();
      box.classList.toggle('hidden', !show);
      if (!show) { box.innerHTML = ''; return; }
      var t = totalPoints(), nm = esc(state.players[preview.moon]);
      box.innerHTML = '<p>🌙 ' + nm + ' heeft alle punten! Wat kies je?</p><div class="row">' +
        '<button type="button" class="btn ghost' + (draft.moonChoice === 'self' ? ' picked' : '') + '" data-c="self">' + nm + ' −' + t + '</button>' +
        '<button type="button" class="btn ghost' + (draft.moonChoice === 'others' ? ' picked' : '') + '" data-c="others">Anderen +' + t + '</button></div>';
      Array.prototype.forEach.call(box.querySelectorAll('button'), function (b) {
        b.addEventListener('click', function () { checkpoint('maankeuze'); draft.moonChoice = b.getAttribute('data-c'); renderEntry(); });
      });
    }

    function updateStatus(preview) {
      renderMoonBox(preview);
      var st = $('entryStatus'); var ok = draftValid();
      var msg;
      if (draft.isManual) {
        var filled = draft.manual.filter(function (v) { return v !== ''; }).length;
        msg = ok ? '✓ Klaar om op te slaan' : 'Nog ' + (state.players.length - filled) + ' speler(s) invullen';
      } else {
        var sum = draft.hearts.reduce(function (a, b) { return a + b; }, 0);
        var left = heartsCount() - sum; var parts = [];
        if (left > 0) parts.push('nog ' + left + ' ♥ te verdelen');
        if (draft.queen < 0) parts.push('wie had de ♠ vrouw?');
        if (jackValue() && draft.jack < 0) parts.push('wie had de ♣ boer?');
        if (preview && preview.needsChoice) parts.push('kies wat er met de maan gebeurt');
        if (ok) {
          msg = '✓ Klaar om op te slaan';
          if (preview && preview.moon >= 0 && moonRule()) msg = '✓ Maan: ' + (draft.moonChoice === 'self' ? state.players[preview.moon] + ' −' + totalPoints() : 'de anderen +' + totalPoints());
        } else {
          msg = parts.join(' · ');
          msg = msg.charAt(0).toUpperCase() + msg.slice(1);
        }
      }
      st.textContent = msg; st.classList.toggle('ok', ok);
      $('btnSave').disabled = !ok;
    }

    $('manualToggle').addEventListener('change', function (e) {
      checkpoint('vrij invoeren ' + (e.target.checked ? 'aan' : 'uit'));
      draft.isManual = e.target.checked;
      if (draft.isManual && draft.hearts.some(function (h) { return h; })) {
        var pv = scoreRound(draft.hearts, draft.queen, draft.jack, 'up').raw;
        draft.manual = pv.map(String);
      }
      renderEntry();
    });

    $('btnSave').addEventListener('click', function () {
      if (!draftValid()) return;
      var round;
      if (draft.isManual) {
        round = { scores: draft.manual.map(function (v) { return parseInt(v, 10); }), manual: true };
      } else {
        var r = draftPreview();
        round = { scores: r.raw, hearts: draft.hearts.slice(), queen: draft.queen, jack: draft.jack, moon: r.moon };
        if (r.moon >= 0 && moonRule()) round.moonChoice = draft.moonChoice;
      }
      checkpoint(editIndex >= 0 ? 'ronde ' + (editIndex + 1) + ' aangepast' : 'ronde ' + (state.rounds.length + 1) + ' opgeslagen');
      var wasFinished = isFinished();
      var flipBefore = runInfo().flipAt;
      if (editIndex >= 0) { state.rounds[editIndex] = round; toast('Ronde ' + (editIndex + 1) + ' aangepast'); }
      else {
        state.rounds.push(round);
        var ri = runInfo();
        if (ri.flipAt >= 0 && flipBefore < 0) toast('⇩ Omgedraaid! Iedereen telt nu af naar 0');
        else if (ri.done) toast('🏆 Er is een winnaar!');
        else toast(round.moon >= 0 && moonRule() ? '🌙 Maan geschoten door ' + state.players[round.moon] + '!' : 'Ronde ' + state.rounds.length + ' opgeslagen');
      }
      editIndex = -1; save(); resetDraft(); render();
      if (!wasFinished && isFinished()) window.scrollTo({ top: 0, behavior: 'smooth' });
    });

    $('btnFinish').addEventListener('click', function () {
      if (!confirm('Spel afronden? De laagste score wint.')) return;
      checkpoint('spel afgerond');
      state.finished = true; editIndex = -1; save(); resetDraft(); render();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });

    $('btnCancelEdit').addEventListener('click', function () { checkpoint('aanpassen geannuleerd'); editIndex = -1; resetDraft(); render(); });

    $('btnUndo').addEventListener('click', function () {
      if (!state.rounds.length) return;
      if (!confirm('Ronde ' + state.rounds.length + ' wissen?')) return;
      checkpoint('ronde ' + state.rounds.length + ' gewist');
      state.rounds.pop(); editIndex = -1; save(); resetDraft(); render(); toast('Laatste ronde gewist');
    });

    /* ---------- Render ---------- */
    function renderInfo() {
      var r = state.rounds.length, n = state.players.length;
      var chips = [];
      if (!isFinished()) {
        chips.push('Ronde ' + (r + 1));
        chips.push('Deler: ' + esc(state.players[r % n]));
        chips.push('Passen: ' + passInfo(r));
      }
      if (flipMode()) chips.push(runInfo().phase === 'down' ? '⇩ Aftellen naar 0' : '⇧ Optellen tot ' + state.settings.target);
      else chips.push('Tot ' + state.settings.target + ' punten');
      $('infoBar').innerHTML = chips.map(function (c) { return '<span class="chip">' + c + '</span>'; }).join('');
    }

    function ranking() {
      var t = totals();
      return state.players.map(function (name, i) { return { name: name, i: i, total: t[i] }; })
        .sort(function (a, b) { return a.total - b.total; });
    }

    function renderStandings() {
      var rk = ranking(); var target = state.settings.target;
      var info = runInfo(); var down = info.flipAt >= 0;
      var fb = $('flipBanner'); fb.classList.toggle('hidden', !down);
      if (down) fb.innerHTML = '⇩ <b>Omgedraaid!</b> Iedereen telt nu af vanaf zijn eigen stand. Veel punten halen is nu goed — wie het eerst op 0 of lager komt, wint.';
      var lowest = rk[0].total; var anyRounds = state.rounds.length > 0;
      var pos = 0, prev = null;
      $('standings').innerHTML = rk.map(function (p, idx) {
        if (p.total !== prev) { pos = idx + 1; prev = p.total; }
        var pct = Math.max(0, Math.min(100, p.total / target * 100));
        var cls = 'stand' + (anyRounds && p.total === lowest ? ' lead' : '') + (!down && p.total >= target * 0.8 ? ' danger' : '');
        return '<div class="' + cls + '"><div class="pos">' + pos + '</div>' +
          '<div><div class="name">' + esc(p.name) + '</div><div class="bar"><i style="width:' + pct + '%"></i></div></div>' +
          '<div class="total">' + p.total + '</div></div>';
      }).join('');
    }

    function renderHistory() {
      var tbl = $('historyTable');
      $('historyPanel').classList.toggle('hidden', !state.rounds.length);
      if (!state.rounds.length) { tbl.innerHTML = ''; return; }
      var head = '<thead><tr><th>#</th>' + state.players.map(function (p) { return '<th title="' + esc(p) + '">' + esc(p) + '</th>'; }).join('') + '</tr></thead>';
      var info = runInfo();
      var body = '<tbody>' + state.rounds.map(function (r, k) {
        var run = info.runs[k], ev = info.eff[k];
        var sep = k === info.flipAt ? '<tr class="flip-row"><td colspan="' + (state.players.length + 1) + '">⇩ Omgedraaid — vanaf hier aftellen</td></tr>' : '';
        return '<tr data-k="' + k + '"' + (k === editIndex ? ' class="editing"' : '') + '><td>' + (k + 1) + '</td>' + r.scores.map(function (v, i) {
          var mark = '';
          if (!r.manual && r.queen === i) mark += ' ♠';
          if (!r.manual && r.jack === i) mark += ' ♣';
          var moon = !r.manual && r.moon === i && moonRule();
          var shown = ev[i] < 0 ? '−' + Math.abs(ev[i]) : ev[i];
          return '<td' + (moon ? ' class="moon"' : '') + '>' + (moon ? '🌙 ' : '') + shown + mark + '<span class="sub">' + run[i] + '</span></td>';
        }).join('') + '</tr>' + sep;
      }).join('') + '</tbody>';
      var t = info.totals;
      var foot = '<tfoot><tr><td>Totaal</td>' + t.map(function (v) { return '<td>' + v + '</td>'; }).join('') + '</tr></tfoot>';
      tbl.innerHTML = head + body + foot;
      Array.prototype.forEach.call(tbl.querySelectorAll('tbody tr[data-k]'), function (tr) {
        tr.addEventListener('click', function () {
          var k = +tr.getAttribute('data-k');
          checkpoint('ronde ' + (k + 1) + ' openen');
          editIndex = k; resetDraft(state.rounds[k]); render();
          $('entryPanel').classList.remove('hidden');
          $('entryPanel').scrollIntoView({ behavior: 'smooth', block: 'start' });
        });
      });
    }

    function renderWinner() {
      var wp = $('winnerPanel'); var done = isFinished();
      wp.classList.toggle('hidden', !done);
      $('entryPanel').classList.toggle('hidden', done && editIndex < 0);
      $('btnFinish').classList.toggle('hidden', !flipMode() || done || editIndex >= 0 || !state.rounds.length);
      if (!done) return;
      var rk = ranking(); var best = rk[0].total;
      var winners = rk.filter(function (p) { return p.total === best; }).map(function (p) { return esc(p.name); });
      wp.innerHTML = '<div class="big">🏆</div><div class="tag">En de winnaar is…</div><h2>' + winners.join(' & ') + ' ' + (winners.length > 1 ? 'winnen' : 'wint') + '!</h2>' +
        '<p class="muted">Met ' + best + ' punten na ' + state.rounds.length + ' rondes.</p>' +
        '<div class="row" style="margin-top:14px"><button class="btn ghost" id="btnRematch" type="button">Revanche</button><button class="btn" id="btnNew2" type="button">Nieuw spel</button></div>' +
        (flipMode() && !runInfo().done ? '<button class="btn ghost small" id="btnResume" type="button" style="margin-top:10px">Toch verder spelen</button>' : '');
      if ($('btnResume')) $('btnResume').addEventListener('click', function () { checkpoint('verder spelen'); state.finished = false; save(); render(); });
      $('btnRematch').addEventListener('click', function () {
        checkpoint('revanche'); state.rounds = []; state.finished = false; state.started = Date.now(); save(); editIndex = -1; resetDraft(); render(); toast('Nieuw potje, zelfde spelers');
      });
      $('btnNew2').addEventListener('click', function () { $('btnNew').click(); });
    }

    function renderRules() {
      var s = state.settings;
      var items = ['Elke ♥ harten = 1 strafpunt (' + heartsCount() + ' harten in het spel)', '♠ Schoppenvrouw = ' + s.queen + ' strafpunten'];
      if (jackValue()) items.push('♣ Klaverboer = ' + jackValue() + ' strafpunten');
      if (flipMode()) items.push('Iedereen telt op tot iemand ' + s.target + ' punten of meer heeft. Dan draait het om ⇩: iedereen telt vanaf zijn eigen stand af en nu wil je juist veel punten. Wie het eerst op 0 of lager komt, wint (negatief mag)');
      else items.push('Wie het eerst ' + s.target + ' punten haalt, beëindigt het spel — de laagste score wint');
      if (moonRule()) items.push('Alle ' + totalPoints() + ' strafpunten in één ronde (de maan 🌙)? Dan kies je: zelf ' + totalPoints() + ' punten eraf, óf alle anderen ' + totalPoints() + ' punten erbij');
      items.push('Met “Vrij invoeren” vul je zelf punten in voor eigen huisregels');
      $('rulesList').innerHTML = items.map(function (i) { return '<li>' + i + '</li>'; }).join('');
    }

    function render() {
      renderInfo(); renderStandings(); renderWinner(); renderEntry(); renderHistory(); renderRules();
    }

    function show() {
      var inGame = !!state;
      $('setup').classList.toggle('hidden', inGame);
      $('game').classList.toggle('hidden', !inGame);
      $('btnNew').classList.toggle('hidden', !inGame);
      if (inGame) { if (!draft || draft.hearts.length !== state.players.length) resetDraft(); render(); }
      else renderSetup();
      window.scrollTo(0, 0);
    }

    $('btnStepBack').addEventListener('click', stepBack);

    setDefaultRules();
    show();
    updateUndoBtn();
  })();
  </script>
</body>
</html>
